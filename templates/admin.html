<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Bhakti Setu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <strong>Bhakti Setu - Admin</strong>
            </a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn" style="display: none;">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </nav>

    <div class="container mt-5">
        <!-- Login Form -->
        <div id="loginSection" class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Admin Login</h3>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="alert alert-danger d-none" id="loginError"></div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Content Management Form -->
        <div id="adminSection" style="display: none;">
            <h2 class="mb-4">Add New Content</h2>
            <div class="card shadow">
                <div class="card-body">
                    <form id="contentForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="contentType" class="form-label">Content Type</label>
                                <select class="form-select" id="contentType" required>
                                    <option value="">Select Type</option>
                                    <option value="story">Story</option>
                                    <option value="mantra">Mantra</option>
                                    <option value="aarti">Aarti</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="language" class="form-label">Language</label>
                                <select class="form-select" id="language" required>
                                    <option value="">Select Language</option>
                                    <option value="hindi">Hindi</option>
                                    <option value="english">English</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" required>
                        </div>

                        <div class="mb-3">
                            <label for="header" class="form-label">Header (Optional)</label>
                            <input type="text" class="form-control" id="header">
                        </div>

                        <div class="mb-3">
                            <label for="summary" class="form-label">Summary</label>
                            <textarea class="form-control" id="summary" rows="3" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="posterUrl" class="form-label">Poster URL (Optional)</label>
                            <input type="url" class="form-control" id="posterUrl">
                        </div>

                        <div class="mb-3">
                            <label for="contentHtml" class="form-label">Content (HTML)</label>
                            <textarea class="form-control" id="contentHtml" rows="10" required></textarea>
                            <small class="form-text text-muted">You can use HTML tags for formatting</small>
                        </div>

                        <div class="mb-3">
                            <label for="audioUrl" class="form-label">Audio URL (Optional)</label>
                            <input type="url" class="form-control" id="audioUrl">
                        </div>

                        <div class="alert alert-danger d-none" id="contentError"></div>
                        <div class="alert alert-success d-none" id="contentSuccess"></div>

                        <button type="submit" class="btn btn-primary">Add Content</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin.js"></script>
</body>
</html>
