<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content - Bhakti Setu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- Navigation -->
    <div class="content-nav">
        <button class="btn btn-outline-primary" onclick="window.location.href='/'">
            <i class="bi bi-house-fill"></i>
        </button>
        <button class="btn btn-outline-primary" onclick="history.back()">
            <i class="bi bi-arrow-left"></i>
        </button>
    </div>

    <!-- Content Display -->
    <div class="container content-view">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div id="contentDisplay">
                    <!-- Loading spinner -->
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Next Button -->
    <div class="content-nav" style="right: 20px;">
        <button class="btn btn-outline-primary" id="nextBtn">
            <i class="bi bi-arrow-right"></i>
        </button>
    </div>

    <!-- Play Button -->
    <button class="btn btn-primary btn-play-random" id="playBtn" title="Play Audio">
        <i class="bi bi-play-fill"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/content.js"></script>
</body>
</html>
