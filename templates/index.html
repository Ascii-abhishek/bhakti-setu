<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhakti Setu - Connecting Devotees Worldwide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- Header with Glass Effect -->
    <nav class="navbar navbar-expand-lg fixed-top glass-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <div class="om-container">
                    <span class="om-symbol">ॐ</span>
                    <div class="om-ring ring-1"></div>
                    <!-- <div class="om-ring ring-2"></div>
                    <div class="om-ring ring-3"></div> -->
                </div>
                <strong>Bhakti Setu</strong>
            </a>
            <!-- Search Bar in Navbar -->
            <div class="navbar-search">
                <div class="input-group search-bar">
                    <input type="text" class="form-control" id="searchInput" 
                           placeholder="Search..." 
                           aria-label="Search">
                    <button class="btn btn-primary" type="button" id="searchBtn">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </div>
            <!-- Theme and Language Toggles -->
            <div class="navbar-controls">
                <button class="btn btn-link control-btn" id="languageToggle" title="Switch Language">
                    <i class="bi bi-translate" id="languageIcon"></i>
                </button>
                <button class="btn btn-link control-btn" id="themeToggle" title="Toggle Theme">
                    <i class="bi bi-sun-fill" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Content Cards -->
    <div class="container content-container">
        <div class="row" id="contentCards">
            <!-- Skeleton Loading -->
            <div class="col-md-6 col-lg-4 mb-4 skeleton-card">
                <div class="card">
                    <div class="skeleton skeleton-img"></div>
                    <div class="card-body">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4 mb-4 skeleton-card">
                <div class="card">
                    <div class="skeleton skeleton-img"></div>
                    <div class="card-body">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4 mb-4 skeleton-card">
                <div class="card">
                    <div class="skeleton skeleton-img"></div>
                    <div class="card-body">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Play Random Button -->
    <button class="btn btn-primary btn-play-random" id="playRandomBtn" title="Listen Random">
        <i class="bi bi-play-fill"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
